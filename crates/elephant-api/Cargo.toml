[package]
name = "elephant-api"
description = "Catálogo único de operaciones del canal de agentes de Elephant Stack"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
elephant-core = { workspace = true, features = ["schema"] }
elephant-logs = { workspace = true, features = ["schema"] }
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
clap.workspace = true

# Los tests escriben en español (docs/i18n.md).
[dev-dependencies]
elephant-core = { workspace = true, features = ["test-locale"] }
