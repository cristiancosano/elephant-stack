[package]
name = "elephant-cli"
description = "CLI `elephant`: el canal de agentes de Elephant Stack"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "elephant"
path = "src/main.rs"

[features]
default = ["mcp"]
mcp = ["dep:elephant-mcp"]

[dependencies]
elephant-api.workspace = true
elephant-mcp = { workspace = true, optional = true }
serde_json.workspace = true
clap.workspace = true
