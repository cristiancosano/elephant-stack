[package]
name = "elephant-core"
description = "Lógica de Elephant Stack sin Tauri ni tokio: servicios, PHP, ajustes y estado compartido"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
ts = ["dep:ts-rs", "elephant-i18n/ts"]
schema = ["dep:schemars", "elephant-i18n/schema"]
# Solo para tests de otros crates: el idioma por defecto es el español (i18n::locale).
test-locale = ["elephant-i18n/test-locale"]

[dependencies]
elephant-i18n.workspace = true
elephant-php.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
jiff.workspace = true
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

# Los tests de core escriben en español (docs/i18n.md).
[dev-dependencies]
elephant-i18n = { workspace = true, features = ["test-locale"] }
