[package]
name = "elephant-i18n"
description = "Idioma de Elephant Stack: Locale, locale() y las macros tr! y tr_str!"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
ts = ["dep:ts-rs"]
schema = ["dep:schemars"]
# Solo para tests de otros crates: el idioma por defecto es el español (locale()).
test-locale = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
