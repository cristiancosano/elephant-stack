[package]
name = "elephant-logs"
description = "Motor de logs de Elephant Stack: descubrimiento de proyectos, lectura y directo"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
ts = ["dep:ts-rs", "elephant-i18n/ts"]
schema = ["dep:schemars", "elephant-i18n/schema"]

[dependencies]
elephant-i18n.workspace = true
elephant-php.workspace = true
serde.workspace = true
serde_json.workspace = true
memchr.workspace = true
jiff.workspace = true
ts-rs = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

# Los tests escriben en español (docs/i18n.md).
[dev-dependencies]
elephant-i18n = { workspace = true, features = ["test-locale"] }
