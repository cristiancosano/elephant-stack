<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elephant Stack</title>
    <link rel="stylesheet" href="/src/styles.css" />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header class="titlebar" data-tauri-drag-region>
      <h1 data-tauri-drag-region>Elephant Stack</h1>
      <span id="summary" class="secondary" data-tauri-drag-region></span>
      <button id="refresh" class="icon" type="button" aria-label="Actualizar" title="Actualizar">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <path
            d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M12 1.5v2.8H9.2"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </button>
      <button id="settings-toggle" class="icon" type="button" aria-label="Ajustes" title="Ajustes" aria-expanded="false">
        <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
          <circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4" />
          <path
            d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"
            fill="none"
            stroke="currentColor"
            stroke-width="1.4"
            stroke-linecap="round"
          />
        </svg>
      </button>
    </header>

    <p id="error" class="error" role="alert" hidden></p>

    <main id="settings-view" hidden>
      <section aria-labelledby="settings-title">
        <h2 id="settings-title">Ajustes</h2>
        <ul class="group">
          <li class="row">
            <label class="name" for="keep-in-menu-bar">Seguir en la barra de menús al cerrar</label>
            <span class="secondary"></span>
            <input id="keep-in-menu-bar" type="checkbox" switch />
          </li>
        </ul>
        <p class="hint">
          Al cerrar o minimizar la ventana, Elephant Stack desaparece del Dock y sigue en la barra
          de menús. Para salir del todo, usa «Salir» en su menú o Cmd+Q.
        </p>
      </section>
    </main>

    <main id="main-view">
      <section id="services-section" aria-labelledby="services-title" hidden>
        <h2 id="services-title">Servicios</h2>
        <ul id="services" class="group"></ul>
      </section>

      <section id="php-section" aria-labelledby="php-title" hidden>
        <h2 id="php-title">PHP</h2>
        <ul id="php" class="group"></ul>
      </section>

      <section id="tools-section" aria-labelledby="tools-title" hidden>
        <h2 id="tools-title">Herramientas</h2>
        <ul id="tools" class="group"></ul>
      </section>

      <details id="missing-section" hidden>
        <summary id="missing-title"></summary>
        <ul id="missing" class="group"></ul>
      </details>
    </main>
  </body>
</html>
