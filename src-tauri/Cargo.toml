[package]
name = "elephant-stack"
version = "0.1.0"
description = "Panel nativo para el entorno de desarrollo local en macOS"
authors = ["Cristian Cosano"]
edition = "2024"

[lib]
# El sufijo `_lib` evita un conflicto de nombres con el binario.
name = "elephant_stack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
elephant-php = { path = "../shim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
