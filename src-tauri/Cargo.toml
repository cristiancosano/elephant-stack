[package]
name = "elephant-stack"
description = "Panel nativo para el entorno de desarrollo local en macOS"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
# El sufijo `_lib` evita un conflicto de nombres con el binario.
name = "elephant_stack_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "=2.7.0"
elephant-core.workspace = true
elephant-logs.workspace = true
serde.workspace = true
serde_json.workspace = true
notify = "=8.2.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSColor", "NSColorSpace", "NSAppearance", "NSApplication", "NSResponder", "objc2-core-foundation"] }

[dev-dependencies]
ts-rs.workspace = true
elephant-core = { workspace = true, features = ["ts"] }
elephant-logs = { workspace = true, features = ["ts"] }
